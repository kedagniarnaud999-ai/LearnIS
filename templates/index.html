<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnIS - Ton Tuteur Intelligent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .chat-container { height: calc(100vh - 160px); }
        .message-user { background-color: #3b82f6; color: white; border-radius: 18px 18px 4px 18px; }
        .message-ai { background-color: #f3f4f6; color: #1f2937; border-radius: 18px 18px 18px 4px; }
        .typing-indicator span { display: inline-block; width: 6px; height: 6px; background-color: #9ca3af; border-radius: 50%; animation: typing 1.4s infinite ease-in-out both; margin: 0 2px; }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm p-4 z-10">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg">
                    <i class="fas fa-brain text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">LearnIS</h1>
                    <p class="text-xs text-gray-500">Tuteur Socratique & Constructiviste</p>
                </div>
            </div>
            <button onclick="clearChat()" class="text-sm text-gray-500 hover:text-red-500 transition">
                <i class="fas fa-trash-alt mr-1"></i> Nouveau sujet
            </button>
        </div>
    </header>

    <!-- Chat Area -->
    <main class="flex-1 overflow-y-auto p-4">
        <div id="chat-box" class="max-w-4xl mx-auto space-y-4 pb-4">
            <!-- Message de bienvenue -->
            <div class="flex gap-3">
                <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center flex-shrink-0 text-blue-600">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="message-ai p-4 shadow-sm max-w-[85%]">
                    <p class="text-sm leading-relaxed">Bonjour ! Je suis LearnIS. Je suis là pour t'aider à apprendre, pas pour faire le travail à ta place. Quel sujet veux-tu explorer aujourd'hui ? Dis-moi ce que tu en sais déjà.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="bg-white border-t p-4">
        <div class="max-w-4xl mx-auto flex gap-3">
            <input type="text" id="user-input" 
                class="flex-1 border border-gray-300 rounded-full px-5 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition shadow-sm"
                placeholder="Pose ta question ou partage ta réflexion..."
                onkeypress="handleEnter(event)">
            <button onclick="sendMessage()" id="send-btn"
                class="bg-blue-600 hover:bg-blue-700 text-white rounded-full w-12 h-12 flex items-center justify-center transition shadow-md disabled:opacity-50">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
        <p class="text-center text-xs text-gray-400 mt-2">LearnIS utilise l'IA pour stimuler ta pensée critique.</p>
    </footer>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        let messageHistory = [];

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function appendMessage(sender, text) {
            const isUser = sender === 'user';
            const div = document.createElement('div');
            div.className = `flex gap-3 ${isUser ? 'flex-row-reverse' : ''}`;
            
            const avatar = isUser 
                ? `<div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center flex-shrink-0 text-gray-600"><i class="fas fa-user"></i></div>`
                : `<div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center flex-shrink-0 text-blue-600"><i class="fas fa-robot"></i></div>`;
            
            const bubbleClass = isUser ? 'message-user' : 'message-ai';
            
            // Conversion simple des sauts de ligne en HTML
            const formattedText = text.replace(/\n/g, '<br>');

            div.innerHTML = `
                ${avatar}
                <div class="${bubbleClass} p-4 shadow-sm max-w-[85%]">
                    <p class="text-sm leading-relaxed">${formattedText}</p>
                </div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.id = 'typing-indicator';
            div.className = 'flex gap-3';
            div.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center flex-shrink-0 text-blue-600"><i class="fas fa-robot"></i></div>
                <div class="message-ai p-4 shadow-sm flex items-center">
                    <div class="typing-indicator"><span></span><span></span><span></span></div>
                </div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // UI Update
            appendMessage('user', text);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            showTyping();

            // Ajout à l'historique local
            messageHistory.push({ sender: 'user', text: text });

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: messageHistory })
                });

                const data = await response.json();
                removeTyping();

                if (data.response) {
                    appendMessage('ai', data.response);
                    messageHistory.push({ sender: 'ai', text: data.response });
                } else if (data.error) {
                    appendMessage('ai', "⚠️ Erreur: " + data.error);
                }
            } catch (error) {
                removeTyping();
                appendMessage('ai', "⚠️ Erreur de connexion au serveur.");
                console.error(error);
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function clearChat() {
            if(confirm("Voulez-vous vraiment recommencer un nouveau sujet ?")) {
                messageHistory = [];
                chatBox.innerHTML = '';
                appendMessage('ai', "Nouveau sujet commencé. Que veux-tu apprendre aujourd'hui ?");
            }
        }
    </script>
</body>
</html>
